name: Build WC Recharge IPA

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        shell: bash
        run: |
          rm -rf build Payload IPA_Output
          mkdir -p build IPA_Output

          set +e
          xcodebuild \
            -project WCRechargeIOS.xcodeproj \
            -target WCRechargeIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

          XCODE_STATUS=$?
          set -e

          echo "xcodebuild exit code: $XCODE_STATUS"

          if [ ! -d "$PWD/build/WCRechargeIOS.app" ]; then
            echo "WCRechargeIOS.app was not generated"
            exit 1
          fi

          echo "App build found. Creating IPA..."

          mkdir -p Payload
          cp -R "$PWD/build/WCRechargeIOS.app" Payload/

          /usr/bin/zip -qry \
            "$PWD/IPA_Output/WCRechargeIOS-unsigned.ipa" \
            Payload

          ls -lh "$PWD/IPA_Output/WCRechargeIOS-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WCRechargeIOS-unsigned-IPA
          path: IPA_Output/WCRechargeIOS-unsigned.ipa
          if-no-files-found: error
